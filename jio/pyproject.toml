[project]
name = "jio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15.1",
    "msgspec>=0.22.0",
    "niquests>=3.21.2",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvloop>=0.23.0",
]

[build-system]
requires = ["hatchling>=1.17.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jio"]

[project]
name = "vtvcab-data"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.12.1",
    "arrow>=1.4.0",
    "msgspec>=0.22.0",
    "niquests>=3.21.0",
    "orjson>=3.13.0",
    "polars>=2.0.0",
    "structlog>=26.1.0",
    "tqdm>=4.70.1",
    "typer>=0.27.3",
    "uvloop>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

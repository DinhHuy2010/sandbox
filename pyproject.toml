[project]
name = "uv-codespace-template"
version = "0.1.0"
description = "GitHub Codespace template with UV-managed Python project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "attrs>=25.4.0",
    "bcrypt>=5.0.0",
    "bleach-allowlist>=1.0.3",
    "certifi>=2026.2.25",
    "content-negotiation>=1.1.2",
    "dulwich>=1.1.0",
    "faker>=40.5.1",
    "fastapi[standard]>=0.135.2",
    "fsspec[http]>=2026.4.0",
    "httpx-sse>=0.4.3",
    "httpx[http2]>=0.28.1",
    "ipython>=9.11.0",
    "jinja2>=3.1.6",
    "json-stream>=2.4.1",
    "lark>=1.3.1",
    "libcst>=1.8.6",
    "logfire[fastapi]>=4.33.0",
    "lxml>=6.0.2",
    "markdown-it-py[linkify,plugins]>=4.0.0",
    "markdownmaker>=0.4.0",
    "more-itertools>=10.8.0",
    "mwxml>=0.3.8",
    "nh3>=0.3.4",
    "openapi-pydantic>=0.5.1",
    "opentelemetry-instrumentation-httpx>=0.62b1",
    "orjson>=3.11.7",
    "packaging>=26.0",
    "polyfactory>=3.3.0",
    "pydantic[email]>=2.12.5",
    "pyinterpeter",
    "pyjwt>=2.13.0",
    "pypi-simple>=1.8.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "simple-repository>=0.11.1",
    "simple-repository-server>=0.10.0",
    "snakemd>=2.4.0",
    "sqlmodel>=0.0.38",
    "starlette>=0.50.0",
    "structlog>=25.5.0",
    "textual>=8.2.7",
    "tqdm>=4.67.1",
    "types-lxml>=2026.1.1",
    "uvicorn>=0.38.0",
    "websockets>=15.0.1",
    "werkzeug>=3.1.8",
]

[tool.uv.workspace]
members = [
    "mywebapp",
    "schemagenerator",
    "mycrawler",
    "pyinterpeter",
    "wpsandbox",
    "students-directory",
    "pypi",
    "gh",
    "geo",
    "pypi-2",
    "dhforge",
    "git-stuff",
    "dhinstaller-project",
    "okwhatever3",
]

[tool.uv.sources]
pyinterpeter = { workspace = true, editable = true }

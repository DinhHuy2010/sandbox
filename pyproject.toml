[project]
name = "uv-codespace-template"
version = "0.1.0"
description = "GitHub Codespace template with UV-managed Python project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "attrs>=25.4.0",
    "certifi>=2026.2.25",
    "content-negotiation>=1.1.2",
    "faker>=40.5.1",
    "httpx>=0.28.1",
    "ipython>=9.11.0",
    "jinja2>=3.1.6",
    "json-stream>=2.4.1",
    "libcst>=1.8.6",
    "lxml>=6.0.2",
    "more-itertools>=10.8.0",
    "orjson>=3.11.7",
    "pydantic[email]>=2.12.5",
    "pyinterpeter",
    "pyyaml>=6.0.3",
    "starlette>=0.50.0",
    "tqdm>=4.67.1",
    "types-lxml>=2026.1.1",
    "uvicorn>=0.38.0",
]

[tool.uv.workspace]
members = [
    "mywebapp",
    "schemagenerator",
    "mycrawler",
    "pyinterpeter",
]

[tool.uv.sources]
pyinterpeter = { workspace = true, editable = true }

[project]
name = "uv-codespace-template"
version = "0.1.0"
description = "GitHub Codespace template with UV-managed Python project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "can-ada>=2.0.0",
    "content-negotiation>=1.1.2",
    "faker>=39.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pillow>=12.0.0",
    "sseclient-py>=1.8.0",
    "starlette>=0.50.0",
    "uvicorn>=0.38.0",
]

[tool.uv.workspace]
members = [
    "myapp",
]
